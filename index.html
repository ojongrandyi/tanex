<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png?v=7" />
    <link rel="icon" type="image/png" sizes="16x16" href="/brand/favicon-16.png?v=7" />
    <link rel="icon" type="image/png" sizes="192x192" href="/brand/icon-192.png?v=7" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/apple-touch-icon.png?v=7" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#1C120E" />

    <!-- Per-page head. The server replaces everything between the tx:head markers with the page's
         own title, description, canonical, hreflang, Open Graph and JSON-LD (server/render/pageMeta.ts).
         What is here is the English home page, used as-is by the Vite dev server. -->
    <!-- tx:head -->
    <title>TanEx | Door-to-Door Delivery in Cameroon &amp; Worldwide Shipping</title>
    <meta name="description" content="TanEx picks up from your door and delivers across Buea, Limbe and Douala by bike, between cities by truck, and worldwide by air, sea, rail and road, with one tracking ID." />
    <link rel="canonical" href="https://tanexsarl.com/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TanEx" />
    <meta property="og:url" content="https://tanexsarl.com/" />
    <meta property="og:title" content="TanEx: From Your Door to the World" />
    <meta property="og:description" content="TanEx picks up from your door and delivers across Buea, Limbe and Douala by bike, between cities by truck, and worldwide by air, sea, rail and road, with one tracking ID." />
    <meta property="og:image" content="https://tanexsarl.com/brand/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="TanEx" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TanEx: From Your Door to the World" />
    <meta name="twitter:description" content="TanEx picks up from your door and delivers across Buea, Limbe and Douala by bike, between cities by truck, and worldwide by air, sea, rail and road, with one tracking ID." />
    <meta name="twitter:image" content="https://tanexsarl.com/brand/og-image.jpg" />
    <meta name="twitter:image:alt" content="TanEx" />

    <!-- Organization structured data. Only confirmed facts (CLAUDE.md §2); add sameAs (social
         profiles) once the owner supplies them, here and in server/render/pageMeta.ts. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "@id": "https://tanexsarl.com/#organization",
        "name": "TanEx",
        "legalName": "Tanex SARL",
        "url": "https://tanexsarl.com/",
        "logo": "https://tanexsarl.com/brand/mark.png",
        "image": "https://tanexsarl.com/brand/og-image.jpg",
        "email": "info@tanexsarl.com",
        "slogan": "From Your Door to the World",
        "description": "TanEx picks up from your door and delivers across Buea, Limbe and Douala by bike, between cities by truck, and worldwide by air, sea, rail and road, with one tracking ID.",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Check Point, opposite Molyko Omnisport Stadium",
          "addressLocality": "Buea",
          "addressCountry": "CM"
        },
        "contactPoint": {
          "@type": "ContactPoint",
          "contactType": "customer service",
          "email": "info@tanexsarl.com",
          "availableLanguage": ["English", "French"]
        }
      }
    </script>
    <!-- /tx:head -->

    <!-- Fonts are self-hosted (src/styles/fonts.ts) and bundled with the main stylesheet. -->

    <!-- Home hero (the largest paint on the landing page), fetched before the app script runs. Same
         sources, sizes and breakpoint as ResponsiveImage in HomePage.tsx, so it is not downloaded twice. -->
    <link rel="preload" as="image" type="image/webp" media="(max-width: 767px)" fetchpriority="high" imagesizes="100vw"
          imagesrcset="/images/site/hero-home-mobile-640.webp 640w, /images/site/hero-home-mobile-1024.webp 1024w, /images/site/hero-home-mobile-1290.webp 1290w">
    <link rel="preload" as="image" type="image/webp" media="(min-width: 768px)" fetchpriority="high" imagesizes="100vw"
          imagesrcset="/images/site/hero-home-640.webp 640w, /images/site/hero-home-1024.webp 1024w, /images/site/hero-home-1600.webp 1600w, /images/site/hero-home-2400.webp 2400w">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <noscript>Powered by <a href="https://coretexcoregroup.com" target="_blank" rel="noopener">Coretex Core Group</a></noscript>
  </body>
</html>
